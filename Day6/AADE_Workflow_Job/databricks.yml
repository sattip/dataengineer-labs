# ═════════════════════════════════════════════════════════════════════════
# Databricks Asset Bundle Definition
# ═════════════════════════════════════════════════════════════════════════
# Αυτό το αρχείο είναι για CI/CD deploy μέσω Databricks CLI:
#   databricks bundle validate
#   databricks bundle deploy --target dev
#   databricks bundle deploy --target prod
#   databricks bundle run aade_daily_pipeline
#
# Για direct UI paste, χρησιμοποίησε το job_definition.yml αντί.
# ═════════════════════════════════════════════════════════════════════════

bundle:
  name: aade-daily-pipeline

# Variables για multi-environment support
variables:
  notebook_root:
    description: "Root path των notebooks στο workspace"
    default: "/Users/<your_email@example.com>/AADE_Workflow_Job"

  notification_email:
    description: "Email για failure notifications"
    default: "<your_email@example.com>"

# Multi-environment targets
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
    variables:
      notification_email: "dev-team@aade.gr"

  staging:
    mode: production
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
    variables:
      notification_email: "staging-alerts@aade.gr"

  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
    variables:
      notification_email: "ops-team@aade.gr"
    # Σε prod, ξεκολλάμε το pause_status
    resources:
      jobs:
        aade_daily_pipeline:
          schedule:
            pause_status: UNPAUSED

# ═════════════════════════════════════════════════════════════════════════
# Resources — εδώ ορίζονται τα jobs, pipelines, schemas, volumes, models
# ═════════════════════════════════════════════════════════════════════════
resources:
  jobs:
    aade_daily_pipeline:
      name: aade_daily_pipeline
      description: |
        Daily ΑΑΔΕ medallion pipeline — Bronze → Silver → Gold με 3 sequential tasks.

      tags:
        team: data-engineering
        domain: aade
        cost_center: tax-analytics
        owner: ${var.notification_email}

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Athens
        pause_status: PAUSED  # overridden στο prod target

      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_duration_warning_threshold_exceeded:
          - ${var.notification_email}
        no_alert_for_skipped_runs: false

      timeout_seconds: 3600
      max_concurrent_runs: 1

      queue:
        enabled: true

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1800

      tasks:
        - task_key: task_1_bronze
          description: "Bronze ingestion: Auto Loader για 4 sources"
          notebook_task:
            notebook_path: ${var.notebook_root}/01_bronze_ingestion
            source: WORKSPACE
          timeout_seconds: 1200
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true

        - task_key: task_2_silver
          description: "Silver: DQ + MERGE"
          depends_on:
            - task_key: task_1_bronze
          notebook_task:
            notebook_path: ${var.notebook_root}/02_silver_quality
            source: WORKSPACE
          timeout_seconds: 1200
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: task_3_gold
          description: "Gold: aggregations + audit"
          depends_on:
            - task_key: task_2_silver
          notebook_task:
            notebook_path: ${var.notebook_root}/03_gold_aggregations
            source: WORKSPACE
          timeout_seconds: 1200
          max_retries: 0
